# --- 1. Namespace (Sin cambios) ---
apiVersion: v1
kind: Namespace
metadata:
  name: app-prueba443
---
# --- 2. Deployment (Sin cambios) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-hello443
  namespace: app-prueba443
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-hello443
  template:
    metadata:
      labels:
        app: app-hello443
    spec:
      containers:
      - name: hello
        image: nginxdemos/hello
        ports:
        - containerPort: 80
---
# --- 3. Service (Sin cambios) ---
apiVersion: v1
kind: Service
metadata:
  name: servicio-hello443
  namespace: app-prueba443
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: app-hello443
---
# --- 4. La Ruta HTTP (CORREGIDA) ---
# Ahora se vincula al listener "https" del Gateway
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ruta-para-hello
  namespace: app-prueba443
spec:
  parentRefs: 
  - name: gateway-principal
    namespace: nginx-gateway
    sectionName: https
  hostnames:
  - "hellogwtest443.chicho.com.ar"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: servicio-hello443
      port: 80
